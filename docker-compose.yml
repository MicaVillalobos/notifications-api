services:
  db:
    image: postgres:17
    container_name: notifications_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: notifications_app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/notifications
      SECRET_KEY: cambiar-esto-en-produccion-por-una-clave-larga
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: